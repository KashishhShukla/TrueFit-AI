version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: truefit_postgres
    restart: always
    environment:
      POSTGRES_DB: truefit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: truefit_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d truefit"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: truefit_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:truefit_password@db:5432/truefit
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
