services:
  - type: web
    name: hr-candidate-ranking-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: truefit-postgres
          property: connectionString

databases:
  - name: truefit-postgres
    databaseName: truefit
    user: truefit
    plan: free
